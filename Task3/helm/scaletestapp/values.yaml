version: v1

replicaCount: 1

image:
  name: ghcr.io/yandex-practicum/scaletestapp
  tag: latest
  pullPolicy: IfNotPresent

service:
  create: true
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  limits:
    cpu: 1
    memory: 30Mi
  requests:
    cpu: 100m
    memory: 30Mi

livenessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 5

readinessProbe:
  httpGet:
    path: /ping
    port: 8080
  initialDelaySeconds: 5

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 10
  targetMemoryUtilizationPercentage: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60

