http {
    upstream logistics_backend {
        server logistics.company.com max_fails=5 fail_timeout=30s;
    }

    server {
        listen 8080;

        location /logistics/ {
            proxy_pass http://logistics_backend;
            proxy_connect_timeout 3s;
            proxy_read_timeout 3s;

            proxy_next_upstream http_502 http_503 http_504;

            proxy_intercept_errors on;
            error_page 502 503 504 = @fallback;
        }

        location @fallback {
            internal;
            default_type application/json;
            return 503 '{"status": "unavailable", "message": "Service temporarily unavailable."}';
        }
    }
}